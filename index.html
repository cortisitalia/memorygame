<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTIS Memory Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a16;
            --bg-panel: #151528;
            --neon-pink: #ff2a85;
            --neon-purple: #9b51e0;
            --neon-cyan: #00f0ff;
            --text-main: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(155, 81, 224, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 42, 133, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-purple);
            animation: pulse-glow 2s infinite alternate;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .difficulty-tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-diff {
            background: rgba(21, 21, 40, 0.8);
            color: #aaa;
            border: 1px solid rgba(155, 81, 224, 0.3);
            padding: 0.4rem 1rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-diff.active {
            background: rgba(155, 81, 224, 0.2);
            color: #fff;
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(155, 81, 224, 0.5);
            text-shadow: 0 0 5px #fff;
        }

        .btn-diff:hover:not(.active) {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(21, 21, 40, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(5px);
            margin-bottom: 1.5rem;
        }

        .stat {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .btn-restart {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-pink);
            padding: 0.5rem 1.2rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.3), inset 0 0 10px rgba(255, 42, 133, 0.3);
        }

        .btn-restart:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), inset 0 0 10px rgba(255,255,255,0.5);
            text-shadow: 0 0 5px #fff;
        }

        .game-board {
            display: grid;
            gap: 10px;
            width: 100%;
            perspective: 1000px;
            margin-bottom: 2rem;
            transition: max-width 0.3s;
        }

        .card {
            width: 100%;
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .card-front {
            background: linear-gradient(135deg, rgba(26,26,46,1) 0%, rgba(22,17,36,1) 100%);
            border: 2px solid rgba(155, 81, 224, 0.5);
            box-shadow: 0 0 10px rgba(155, 81, 224, 0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-front::after {
            content: 'C';
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
        }

        .card:hover .card-front {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        .card-back {
            background: #000;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: rotateY(180deg);
            padding: 0;
            overflow: hidden;
        }

        .card.matched .card-back {
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.6);
            animation: match-pulse 1s ease-out;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 22, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: rgba(21, 21, 40, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(155, 81, 224, 0.5), inset 0 0 20px rgba(155, 81, 224, 0.2);
            text-align: center;
            transform: translateY(50px) scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 400px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }

        .modal-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #ddd;
        }

        .modal-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink); }
            100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 30px var(--neon-pink), 0 0 60px var(--neon-pink), 0 0 90px var(--neon-purple); }
        }

        @keyframes match-pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .game-board { gap: 6px; }
            .game-board[data-cols="6"] { grid-template-columns: repeat(4, 1fr) !important; }
            .card-front::after { font-size: 1.5rem; }
            .stats-container { padding: 0.8rem; flex-direction: column; gap: 10px; }
            .stat { font-size: 1rem; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CORTIS</h1>
        <div class="subtitle">Memory Game</div>

        <div class="difficulty-tabs">
            <button class="btn-diff active" onclick="setDifficulty(8, 4, event)">Facile</button>
            <button class="btn-diff" onclick="setDifficulty(10, 4, event)">Medio</button>
            <button class="btn-diff" onclick="setDifficulty(12, 4, event)">Difficile</button>
            <button class="btn-diff" onclick="setDifficulty(18, 6, event)">Estremo</button>
        </div>
        
        <div class="stats-container">
            <div class="stat">Mosse: <span id="moves" class="stat-value">0</span></div>
            <div class="stat">Tempo: <span id="timer" class="stat-value">00:00</span></div>
            <button class="btn-restart" id="restart-btn" onclick="initGame()">Riavvia</button>
        </div>
    </header>

    <div class="game-board" id="game-board"></div>

    <div class="modal-overlay" id="victory-modal">
        <div class="modal-content">
            <div class="modal-title">Sei un vero COER! 💖</div>
            <div class="modal-text">Hai completato il livello, che memoria!</div>
            <div class="modal-stats">
                <div class="stat">Mosse: <span id="final-moves" class="stat-value">0</span></div>
                <div class="stat">Tempo: <span id="final-timer" class="stat-value">00:00</span></div>
            </div>
            <button class="btn-restart" onclick="initGame()">Gioca Ancora</button>
        </div>
    </div>

    <script>
        const allImages = [
            "https://i.pinimg.com/736x/11/36/d0/1136d03afffdea35190e69de74f53845.jpg",
            "https://i.pinimg.com/736x/b5/79/9f/b5799f674d092bf71bb16894796b9d65.jpg",
            "https://i.pinimg.com/736x/2c/2f/21/2c2f210b38793fd82c634ba011b55d34.jpg",
            "https://i.pinimg.com/736x/f4/1f/38/f41f38c15c5802f293569ffa163e9b37.jpg",
            "https://i.pinimg.com/736x/32/7c/5e/327c5e0ed520842c5be165873cd6c532.jpg",
            "https://i.pinimg.com/736x/80/d4/0d/80d40d1d000bf4e323952331856842c4.jpg",
            "https://i.pinimg.com/1200x/68/b2/c3/68b2c3f7a3f515fe1bf68bf4f52433bf.jpg",
            "https://i.pinimg.com/736x/d5/46/e6/d546e656a2b3350c6b71c06d86bc018f.jpg",
            "https://i.pinimg.com/736x/9d/c1/11/9dc11196f5bfd5bb6ad1b2bd1357c93e.jpg",
            "https://i.pinimg.com/736x/75/fd/d2/75fdd29a0f05ef96b349a03fc30640d1.jpg",
            "https://i.pinimg.com/736x/0d/b8/66/0db86626e52d08ab290079f6f7c205db.jpg",
            "https://i.pinimg.com/736x/ae/8b/3a/ae8b3a06f16cf53137d35d29714829f2.jpg",
            "https://i.pinimg.com/736x/f4/c1/db/f4c1dbe2d3034db373d00822d98b5afd.jpg",
            "https://i.pinimg.com/736x/f5/7f/5d/f57f5d92b41fe1d1a535201464318cac.jpg",
            "https://i.pinimg.com/736x/6f/ed/5a/6fed5a22c2e18fdbccd534eeff48aec0.jpg",
            "https://i.pinimg.com/736x/77/54/f4/7754f41929abff52a781d3035adb6605.jpg",
            "https://i.pinimg.com/736x/18/1e/a4/181ea4c86ec554d3e12969e8cb68cf5c.jpg",
            "https://i.pinimg.com/736x/da/c0/7b/dac07b9f9e897e8cb2963035411f853e.jpg",
            "https://i.pinimg.com/736x/f4/49/b8/f449b8fec461342982435432ca2c8189.jpg",
            "https://i.pinimg.com/736x/85/88/f6/8588f6d6b10a251ce1881d3f90d71b27.jpg",
            "https://i.pinimg.com/736x/7d/ac/eb/7daceb10cef84cd5b4d16041f334eefe.jpg",
            "https://i.pinimg.com/736x/f0/95/09/f09509db74742cd59726bc62e4d1defd.jpg",
            "https://i.pinimg.com/736x/93/e8/4e/93e84ec6bd408e9b22272f87e5b8aada.jpg",
            "https://i.pinimg.com/1200x/3c/16/95/3c16959b92796d583ea520c2b60216c7.jpg",
            "https://i.pinimg.com/736x/cf/4b/70/cf4b705fe4fcc7b83acbc9c147085f8e.jpg"
        ];

        let currentPairs = 8;
        let currentCols = 4;
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0, matches = 0;
        let timerInterval, secondsElapsed = 0, gameStarted = false;

        const boardElement = document.getElementById('game-board');
        const movesElement = document.getElementById('moves');
        const timerElement = document.getElementById('timer');
        const modalElement = document.getElementById('victory-modal');

        function setDifficulty(pairs, cols, event) {
            currentPairs = pairs;
            currentCols = cols;
            
            document.querySelectorAll('.btn-diff').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            
            initGame();
        }

        function initGame() {
            boardElement.innerHTML = '';
            resetBoard();
            moves = 0; matches = 0;
            movesElement.innerText = moves;
            
            stopTimer();
            secondsElapsed = 0;
            gameStarted = false;
            timerElement.innerText = "00:00";
            modalElement.classList.remove('active');

            let shuffledDb = [...allImages];
            shuffle(shuffledDb);
            let selectedImages = shuffledDb.slice(0, currentPairs);
            let deck = [...selectedImages, ...selectedImages];
            shuffle(deck);

            boardElement.style.gridTemplateColumns = `repeat(${currentCols}, 1fr)`;
            boardElement.style.maxWidth = currentCols === 6 ? '700px' : '500px';
            boardElement.dataset.cols = currentCols; 

            deck.forEach(imgUrl => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.name = imgUrl; 

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">
                            <img src="${imgUrl}" class="card-img" alt="Cortis">
                        </div>
                    </div>
                `;
                cardEl.addEventListener('click', flipCard);
                boardElement.appendChild(cardEl);
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startTimer() {
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    const minutes = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                    const seconds = String(secondsElapsed % 60).padStart(2, '0');
                    timerElement.innerText = `${minutes}:${seconds}`;
                }, 1000);
            }
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            startTimer();
            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesElement.innerText = moves;
            
            firstCard.dataset.name === secondCard.dataset.name ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            matches++;

            if (matches === currentPairs) setTimeout(showVictory, 500);
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard, firstCard, secondCard] = [false, false, null, null];
        }

        function showVictory() {
            stopTimer();
            document.getElementById('final-moves').innerText = moves;
            document.getElementById('final-timer').innerText = timerElement.innerText;
            modalElement.classList.add('active');
        }

        window.onload = initGame;
    </script>
</body>
</html>
